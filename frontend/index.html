<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipSync - 跨设备剪贴板与文件同步</title>
    <meta name="description" content="跨设备实时同步剪贴板文本和文件" />
    <!-- 渲染前先按本浏览器保存的主题（跟随系统时看系统深浅色）设好 data-theme，规则与 src/utils/theme.js 一致；
         全局样式随脚本加载，在那之前由这里的底色兜底，深色用户刷新时不会先闪一下白底 -->
    <script>
      (function () {
        var mode = 'system'
        try {
          mode = localStorage.getItem('theme') || 'system'
        } catch (e) {}
        var dark = mode === 'dark' || (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <style>
      html[data-theme='dark'] { color-scheme: dark; background: #111113; }
      .boot-loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; font: 14px system-ui, sans-serif; color: #6b6b74; }
      html[data-theme='dark'] .boot-loading { color: #93939d; }
    </style>
  </head>
  <body>
    <!-- 启动时要先向后端确认登录状态才会挂载页面；这段占位在挂载时被 Vue 替换，后端响应慢时不至于一片空白 -->
    <div id="app">
      <div class="boot-loading">
        加载中…
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
