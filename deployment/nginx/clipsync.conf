# ClipSync Nginx 配置（HTTP 阶段，仅限可信内网）
# deploy.sh 默认安装本文件；切换 HTTPS 时改用同目录的 clipsync-https.conf（见 DEPLOY.md）
#
# 注意：Debian/Ubuntu 自带的 /etc/nginx/sites-enabled/default 也监听 80 端口，
# 会先接走请求，部署前请删除该软链。

server {
    listen 80;
    server_name _;

    # 单个请求只承载一个分片（服务端上限 CHUNK_SIZE，默认 5MB），留足余量
    client_max_body_size 100M;

    root /var/www/clipsync/frontend/dist;

    # 前端静态文件（含 SPA 路由 /access/<code>，由 try_files 回落到 index.html）
    # 安全响应头：API 由后端下发，SPA 页面由这里下发
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    # 入口页不缓存：重新构建后浏览器立即拿到引用新资源的 index.html
    # （本 location 有自己的 add_header，不会继承上面的，安全头需重复写）
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # 后端 API（含免登录接口 /api/access/*）
    # 用 127.0.0.1 而不是 localhost：后端只监听 IPv4 回环，localhost 可能先解析成 ::1
    location /api {
        proxy_pass http://127.0.0.1:8000;
        # $http_host 保留端口（非 80 端口部署时），后端据此拼出的访问码链接才正确
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 限流依赖真实客户端 IP，必须透传
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # WebSocket
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}
