# HTTPS 站点配置：启用 HTTPS 时由 docker-compose.https.yml 挂载，替换 nginx-docker.conf
# 证书路径固定为 cert.sh 申请时指定的证书名 clipsync，换域名不用改本文件

# 80 端口：只保留 Let's Encrypt 验证（续期要用），其余请求跳转到 HTTPS
server {
    listen 80;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/clipsync/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clipsync/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 只用带前向保密的 ECDHE + AEAD 套件（Mozilla intermediate 去掉需要 DH 参数文件的 DHE 部分）；
    # TLS 1.3 的套件由 OpenSSL 固定，不受这一行影响。让客户端按自己的偏好选
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS 不在这里配置：由后端按 .env 的 HSTS_ENABLED 下发
    include /etc/nginx/snippets/clipsync-common.conf;
}
