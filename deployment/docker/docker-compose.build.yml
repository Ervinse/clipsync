# 在服务器上从源码构建镜像（叠加在 docker-compose.yml 之上使用）
# 需要服务器上有完整项目源码，并且能访问 Docker Hub、Debian、PyPI、npm 等下载源。
# 网络受限的服务器请改用开发机构建（build-release.ps1，见 README.md）。
#
# 用法（在 deployment/docker 目录）：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  backend:
    build:
      context: ../../backend
      dockerfile: ../deployment/docker/Dockerfile.backend
    # 覆盖 docker-compose.yml 的 pull_policy: never，改为本地构建
    pull_policy: build

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deployment/docker/Dockerfile.frontend
    pull_policy: build
