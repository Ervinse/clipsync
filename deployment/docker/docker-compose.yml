version: '3.8'

services:
  # MySQL 数据库
  db:
    image: mysql:8.0
    container_name: clipsync-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-clipsync}
      MYSQL_USER: ${DB_USER:-clipsync}
      MYSQL_PASSWORD: ${DB_PASSWORD:-clipsync_password}
    volumes:
      - mysql_data:/var/lib/mysql
    # 不对宿主机暴露 3306，仅容器网络内可访问
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端服务
  backend:
    build:
      context: ../../backend
      dockerfile: ../deployment/docker/Dockerfile.backend
    container_name: clipsync-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-clipsync}
      DB_PASSWORD: ${DB_PASSWORD:-clipsync_password}
      DB_NAME: ${DB_NAME:-clipsync}
      # 变量名必须与 backend/app/config.py 一致；JWT_SECRET 未设置时 compose 直接报错
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 未设置}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      DEPLOY_SCHEME: ${DEPLOY_SCHEME:-http}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      STORAGE_DIR: /app/storage
    volumes:
      - storage_data:/app/storage
    # 不对宿主机暴露 8000，只经前端容器的 Nginx 访问
    # 单 worker（WebSocket 与限流依赖进程内存）；信任容器网络内的 Nginx 发来的 X-Forwarded-For
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
        --proxy-headers --forwarded-allow-ips '172.16.0.0/12,10.0.0.0/8,192.168.0.0/16'
      "

  # 前端服务
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deployment/docker/Dockerfile.frontend
    container_name: clipsync-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
    driver: local
  storage_data:
    driver: local
