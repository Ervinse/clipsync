# ClipSync Nginx 公共配置：nginx-docker.conf（HTTP）与 nginx-https.conf（HTTPS）的 server 块都 include 本文件。
# 由 docker-compose.yml 挂载到 frontend 容器的 /etc/nginx/snippets/clipsync-common.conf

# 不在错误页和 Server 响应头里暴露 Nginx 版本号
server_tokens off;

# 单个请求只承载一个上传分片（服务端上限 CHUNK_SIZE，默认 5MB）或一段剪贴板文本（后端上限 8MB），留一点余量
client_max_body_size 10m;

root /usr/share/nginx/html;

# Docker 内置 DNS：backend 容器重建后 IP 会变，按变量写 proxy_pass 让 Nginx 运行时重新解析，
# 而不是在启动时解析一次并一直缓存旧 IP
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend_upstream http://backend:8000;

# Let's Encrypt 验证文件：cert.sh 申请、续期证书时写入宿主机的 ./acme
location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
}

# 前端静态文件（含 SPA 路由，如快速访问页 /quick，由 try_files 回落到 index.html）
# 安全响应头：API 由后端下发，页面由这里下发
location / {
    try_files $uri $uri/ /index.html;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

# 入口页不缓存：重新构建后浏览器立即拿到引用新资源的 index.html
# （本 location 有自己的 add_header，不会继承上面的，安全头需重复写）
location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}

# Vite 构建产物：文件名带内容哈希，内容一变文件名就变，可以长期缓存
location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# 后端 API（含免登录接口 /api/access/*）
location /api {
    proxy_pass $backend_upstream;
    # $http_host 保留端口（如 :8080），后端看到的 Host 与浏览器地址栏一致
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # 覆盖而不是追加：客户端自带的 X-Forwarded-For 一律丢弃，限流拿到的就是真实来源 IP
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

# WebSocket
location /ws {
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    # $http_upgrade 是客户端请求里的 Upgrade 头（Nginx 没有 $upgrade 这个变量，写错会导致启动失败）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 7d;
    proxy_send_timeout 7d;
    proxy_read_timeout 7d;
}
