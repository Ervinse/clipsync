# Nginx 配置（Docker 环境）

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    root /usr/share/nginx/html;

    # Docker 内置 DNS：backend 容器重建后 IP 会变，按变量写 proxy_pass 让 Nginx 运行时重新解析，
    # 而不是在启动时解析一次并一直缓存旧 IP
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # 前端静态文件（含 SPA 路由 /access/<code>，由 try_files 回落到 index.html）
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # 入口页不缓存：重新构建后浏览器立即拿到引用新资源的 index.html
    # （本 location 有自己的 add_header，不会继承上面的，安全头需重复写）
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # 后端 API（安全响应头由后端统一下发）
    location /api {
        proxy_pass $backend_upstream;
        # $http_host 保留端口（如 :8080），后端据此拼出的访问码链接才正确
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而不是追加：客户端自带的 X-Forwarded-For 一律丢弃，限流拿到的就是真实来源 IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # WebSocket
    location /ws {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # 访问码公开页 /access/<code> 是前端 SPA 路由，由 location / 的 try_files 处理；
    # 数据接口走 /api/access/*，已被上面的 /api 覆盖
}
